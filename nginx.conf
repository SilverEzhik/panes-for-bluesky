server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = __BASE_NO_SLASH__ { return 301 __BASE_URL__; }
    location __BASE_URL__ { try_files $uri $uri/ __BASE_URL__index.html; }
    location = __BASE_URL__sw.js {
        add_header Cache-Control "no-cache";
    }
    location = __BASE_URL__index.html {
        add_header Cache-Control "no-cache";
    }
    location = __BASE_URL__manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }
    location __BASE_URL__assets/original/ {
        add_header Cache-Control "no-cache";
    }
    location __BASE_URL__icons/ {
        add_header Cache-Control "no-cache";
    }
    location __BASE_URL__assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
